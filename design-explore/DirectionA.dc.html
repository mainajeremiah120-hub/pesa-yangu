<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: #0B1120; }
    a { color: #00D4AA; } a:hover { color: #33E0BF; }
  </style>
</helmet>

<div style="width:640px; min-height:680px; background:#0B1120; padding:24px; font-family:'Inter',sans-serif;">

  <div style="background:#15202E; border:1px solid #1E2E42; border-radius:16px; padding:24px 26px;">

    <!-- Header -->
    <div style="display:flex; align-items:center; gap:11px; margin-bottom:20px;">
      <div style="width:32px; height:32px; border-radius:9px; background:rgba(0,212,170,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 15l6-6"/>
          <path d="M11 5.5l1-1a3.5 3.5 0 015 5l-1 1"/>
          <path d="M13 18.5l-1 1a3.5 3.5 0 01-5-5l1-1"/>
        </svg>
      </div>
      <div>
        <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#00D4AA; margin-bottom:2px;">Household</div>
        <div style="font-size:12px; color:#8B9ABB;">Share your entire financial life with a partner</div>
      </div>
    </div>

    <!-- Row 1 -->
    <div style="display:flex; align-items:center; gap:13px; background:#1E2E42; border-radius:12px; padding:14px 16px; margin-bottom:10px;">
      <div style="width:38px; height:38px; border-radius:50%; background:rgba(0,212,170,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="3"/>
          <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
          <circle cx="17" cy="7" r="2.5"/>
          <path d="M14.5 20c0-2.8 1.8-5 4-5.6"/>
        </svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:13.5px; font-weight:600; color:#F0F4FF; margin-bottom:2px;">Link with a Partner</div>
        <div style="font-size:11.5px; color:#8B9ABB;">Generate a code to share — only works from a brand-new account</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D5068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </div>

    <!-- Row 2 -->
    <div style="display:flex; align-items:center; gap:13px; background:#1E2E42; border-radius:12px; padding:14px 16px; margin-bottom:22px;">
      <div style="width:38px; height:38px; border-radius:50%; background:rgba(245,200,66,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="15" r="4"/>
          <path d="M11 12l7-7"/>
          <path d="M15 5l3 3"/>
          <path d="M13 7l2 2"/>
        </svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:13.5px; font-weight:600; color:#F0F4FF; margin-bottom:2px;">Join with a Code</div>
        <div style="font-size:11.5px; color:#8B9ABB;">Have a code from your partner? Enter it here</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D5068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </div>

    <!-- Divider -->
    <div style="height:1px; background:#1E2E42; margin-bottom:18px;"></div>
    <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#3D5068; margin-bottom:12px;">Once you generate a code</div>

    <!-- Inline code preview row -->
    <div style="display:flex; align-items:center; gap:14px; background:#1E2E42; border-radius:12px; padding:14px 16px; margin-bottom:12px;">
      <div style="width:38px; height:38px; border-radius:10px; background:rgba(0,212,170,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 15l6-6"/>
          <path d="M11 5.5l1-1a3.5 3.5 0 015 5l-1 1"/>
          <path d="M13 18.5l-1 1a3.5 3.5 0 01-5-5l1-1"/>
        </svg>
      </div>
      <div style="flex:1;">
        <div style="font-family:'Inter',sans-serif; font-weight:800; font-size:17px; letter-spacing:0.1em; color:#00D4AA;">FWNM&#8209;3RHF</div>
        <div style="font-size:10.5px; color:#3D5068; margin-top:2px;">Expires in 7 days</div>
      </div>
      <div style="width:30px; height:30px; border-radius:8px; background:#0B1120; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F0F4FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="11" rx="2"/>
          <path d="M5 15V5a2 2 0 012-2h10"/>
        </svg>
      </div>
    </div>

    <!-- Slim button row -->
    <div style="display:flex; gap:10px;">
      <button style="flex:1; background:transparent; color:#8B9ABB; border:1px solid #1E2E42; border-radius:10px; padding:10px; font-family:inherit; font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B9ABB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="11" rx="2"/>
          <path d="M5 15V5a2 2 0 012-2h10"/>
        </svg>
        Copy Code
      </button>
      <button style="flex:1; background:transparent; color:#25D366; border:1px solid #25D36655; border-radius:10px; padding:10px; font-family:inherit; font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
        </svg>
        Share via WhatsApp
      </button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
