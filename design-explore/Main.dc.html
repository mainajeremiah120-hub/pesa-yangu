<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: #0B1120; }
    a { color: #00D4AA; } a:hover { color: #33E0BF; }
  </style>
</helmet>

<div style="width:640px; min-height:880px; background:#0B1120; padding:24px; font-family:'Inter',sans-serif;">

  <div style="background:#15202E; border:1px solid #1E2E42; border-radius:16px; padding:26px 28px 30px;">

    <!-- Header -->
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:26px;">
      <div style="width:34px; height:34px; border-radius:10px; background:rgba(0,212,170,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 15l6-6"/>
          <path d="M11 5.5l1-1a3.5 3.5 0 015 5l-1 1"/>
          <path d="M13 18.5l-1 1a3.5 3.5 0 01-5-5l1-1"/>
        </svg>
      </div>
      <div>
        <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#00D4AA; margin-bottom:3px;">Household</div>
        <div style="font-size:12px; color:#8B9ABB;">Share your entire financial life with a partner — same data, separate logins</div>
      </div>
    </div>

    <!-- Relationship diagram — not linked -->
    <div style="display:flex; align-items:center; justify-content:center; gap:0; margin:8px 0 6px;">
      <div style="width:64px; height:64px; border-radius:50%; background:linear-gradient(150deg,#0F3A32,#15202E); border:2px solid #00D4AA; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <span style="font-family:'DM Serif Display',serif; font-size:24px; color:#F0F4FF;">M</span>
      </div>
      <div style="position:relative; flex:1; height:2px; margin:0 -2px;">
        <div style="position:absolute; inset:0; border-top:2px dashed #3D5068;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%; background:#0B1120; border:1px solid #1E2E42; display:flex; align-items:center; justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3D5068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 15l6-6"/>
            <path d="M11 5.5l1-1a3.5 3.5 0 015 5l-1 1"/>
            <path d="M13 18.5l-1 1a3.5 3.5 0 01-5-5l1-1"/>
          </svg>
        </div>
      </div>
      <div style="width:64px; height:64px; border-radius:50%; border:2px dashed #3D5068; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D5068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
    </div>
    <div style="text-align:center; font-size:11.5px; color:#8B9ABB; margin-bottom:24px;">Not linked yet</div>

    <!-- Primary CTA -->
    <button style="width:100%; background:#00D4AA; color:#0B1120; border:none; border-radius:12px; padding:14px; font-family:inherit; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1120" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 15l6-6"/>
        <path d="M11 5.5l1-1a3.5 3.5 0 015 5l-1 1"/>
        <path d="M13 18.5l-1 1a3.5 3.5 0 01-5-5l1-1"/>
      </svg>
      Generate Invite Code
    </button>
    <div style="text-align:center; font-size:12px; color:#8B9ABB; margin-top:14px;">
      Already have a code? <span style="color:#00D4AA; font-weight:700;">Join here</span>
    </div>

    <!-- Divider -->
    <div style="height:1px; background:#1E2E42; margin:28px 0 22px;"></div>

    <!-- Once generated -->
    <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#3D5068; margin-bottom:16px;">Once you generate a code</div>

    <div style="display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:20px;">
      <div style="width:64px; height:64px; border-radius:50%; background:linear-gradient(150deg,#0F3A32,#15202E); border:2px solid #00D4AA; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <span style="font-family:'DM Serif Display',serif; font-size:24px; color:#F0F4FF;">M</span>
      </div>
      <div style="position:relative; flex:1; height:2px; margin:0 -2px;">
        <div style="position:absolute; inset:0; border-top:2px solid #00D4AA; opacity:0.5;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%; background:#0B1120; border:1px solid #00D4AA; display:flex; align-items:center; justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 15l6-6"/>
            <path d="M11 5.5l1-1a3.5 3.5 0 015 5l-1 1"/>
            <path d="M13 18.5l-1 1a3.5 3.5 0 01-5-5l1-1"/>
          </svg>
        </div>
      </div>
      <div style="width:64px; height:64px; border-radius:50%; border:2px dashed #F5C842; box-shadow:0 0 0 6px rgba(245,200,66,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5C842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </div>
    </div>

    <div style="background:#0B1120; border-radius:12px; padding:22px; text-align:center;">
      <div style="font-family:'Inter',sans-serif; font-weight:800; font-size:27px; letter-spacing:0.13em; color:#00D4AA;">FWNM&#8209;3RHF</div>
      <div style="font-size:11px; color:#3D5068; margin-top:6px;">Expires in 7 days</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px;">
        <div style="width:40px; height:40px; border-radius:50%; background:#1E2E42; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0F4FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15V5a2 2 0 012-2h10"/>
          </svg>
        </div>
        <div style="width:40px; height:40px; border-radius:50%; background:#1E2E42; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0F4FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
